<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kikitori</title>
<style>
:root{
  --bg:#e6ebec; --panel:#f6f5f1; --ink:#26343b; --muted:#78878e; --line:#d0d8da;
  --screen:#243139; --accent:#4a7a96; --accent-ink:#ffffff; --tint:rgba(74,122,150,.14); --err:#b3372f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161f24; --panel:#1f2b32; --ink:#e7eef0; --muted:#8c9ea6; --line:#31424b;
    --screen:#0e161a; --accent:#86b4cf; --accent-ink:#0e161a; --tint:rgba(134,180,207,.18); --err:#ee8279;
  }
}
:root[data-theme="dark"]{
  --bg:#161f24; --panel:#1f2b32; --ink:#e7eef0; --muted:#8c9ea6; --line:#31424b;
  --screen:#0e161a; --accent:#86b4cf; --accent-ink:#0e161a; --tint:rgba(134,180,207,.18); --err:#ee8279;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  line-height:1.7; padding:28px 16px 64px;
}
main{max-width:720px; margin:0 auto}
header{margin:0 0 18px 2px}
h1{font-size:1.15rem; margin:0; font-weight:500; letter-spacing:.04em}
.sub{margin:2px 0 0; color:var(--muted); font-size:.82rem}

/* 本体 */
.device{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px}
.screen{
  position:relative; background:var(--screen); border-radius:8px; overflow:hidden;
  aspect-ratio:16/9; display:grid; place-items:center;
}
.screen video{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:var(--screen)}
.screen video:not([src]){display:none}
.screen .empty{color:#8fa1a9; font-size:.85rem}
.screen.loaded .empty{display:none}

.controls{display:flex; flex-wrap:wrap; gap:18px 24px; align-items:flex-end; justify-content:space-between; margin-top:18px}
.settings{display:grid; gap:10px; min-width:0}
.field{display:grid; grid-template-columns:3.2em auto; align-items:center; gap:10px; font-size:.8rem; color:var(--muted)}
.fname{max-width:15em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.filebtn{
  position:relative; display:inline-block; font-size:.85rem; color:var(--ink);
  border:1px solid var(--ink); border-radius:8px; padding:7px 14px; cursor:pointer;
}
.filebtn:hover{background:var(--ink); color:var(--panel)}
.filebtn input{position:absolute; inset:0; opacity:0; cursor:pointer; width:100%}
.filebtn:focus-within{outline:2px solid var(--accent); outline-offset:2px}

.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.seg label{position:relative}
.seg label + label{border-left:1px solid var(--line)}
.seg input{position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:pointer}
.seg span{display:block; padding:6px 14px; font-size:.82rem; color:var(--muted)}
.seg input:checked + span{background:var(--ink); color:var(--panel)}
.seg input:focus-visible + span{outline:2px solid var(--accent); outline-offset:-2px}

/* キー（丸ボタン＋下にラベル） */
.key{
  all:unset; box-sizing:border-box; display:inline-flex; flex-direction:column; align-items:center; gap:6px;
  cursor:pointer; font-size:.72rem; color:var(--muted); text-align:center;
}
.key .disc{
  width:42px; height:42px; border-radius:50%; display:grid; place-items:center;
  background:var(--bg); color:var(--ink); border:1px solid var(--line);
}
.key svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.key:hover:not(:disabled) .disc{border-color:var(--ink)}
.key:disabled{opacity:.4; cursor:not-allowed}
.key:focus-visible .disc{outline:2px solid var(--accent); outline-offset:2px}
.key.main .disc{width:68px; height:68px; background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.key.main svg{width:24px; height:24px; fill:currentColor; stroke:none}
.key.main{color:var(--ink)}
.key.main:disabled .disc{background:var(--line); border-color:var(--line); color:var(--muted)}

.line{margin-top:16px; border-top:1px solid var(--line); padding-top:12px}
#status{font-size:.82rem; color:var(--muted); min-height:1.4em}
#status.err{color:var(--err)}
progress{
  -webkit-appearance:none; appearance:none; display:block; width:100%; height:3px; margin-top:8px;
  border:0; background:var(--line); border-radius:2px; overflow:hidden;
}
progress::-webkit-progress-bar{background:var(--line)}
progress::-webkit-progress-value{background:var(--accent)}
progress::-moz-progress-bar{background:var(--accent)}

/* 文字起こし */
.tools{display:flex; gap:22px; margin:22px 2px 10px}
#list{
  list-style:none; margin:0; padding:0; max-height:46vh; overflow-y:auto;
  background:var(--panel); border:1px solid var(--line); border-radius:14px;
}
#list:empty::before{content:"文字起こしはここに表示されます"; display:block; padding:20px 18px; color:var(--muted); font-size:.85rem}
#list li{
  display:grid; grid-template-columns:3.6em 1fr; gap:10px; padding:10px 18px 10px 15px;
  border-left:3px solid transparent; border-bottom:1px solid var(--line); cursor:pointer;
}
#list li:last-child{border-bottom:0}
#list li time{color:var(--muted); font-size:.78rem; font-variant-numeric:tabular-nums; padding-top:.2em}
#list li:hover{background:var(--bg)}
#list li.active{border-left-color:var(--accent); background:var(--tint); font-weight:500}
#list li.active time{color:var(--ink)}
.note{margin:18px 2px 0; font-size:.76rem; color:var(--muted)}
</style>
</head>
<body>
<main>
  <header>
    <h1>Kikitori</h1>
    <p class="sub">ブラウザの中でWhisperを動かします。動画はどこにも送信されません。</p>
  </header>

  <section class="device">
    <div class="screen" id="screen">
      <span class="empty">動画を選んでください</span>
      <video id="video" controls playsinline></video>
    </div>

    <div class="controls">
      <div class="settings">
        <div class="field">
          <span>動画</span>
          <span style="display:flex;align-items:center;gap:12px;min-width:0">
            <label class="filebtn"><input type="file" id="file" accept="video/*,audio/*">選ぶ</label>
            <span class="fname" id="fname">未選択</span>
          </span>
        </div>
        <div class="field">
          <span>モデル</span>
          <div class="seg" role="radiogroup" aria-label="モデル">
            <label><input type="radio" name="model" value="onnx-community/whisper-tiny"><span>tiny</span></label>
            <label><input type="radio" name="model" value="onnx-community/whisper-base" checked><span>base</span></label>
            <label><input type="radio" name="model" value="onnx-community/whisper-small"><span>small</span></label>
          </div>
        </div>
        <div class="field">
          <span>言語</span>
          <div class="seg" role="radiogroup" aria-label="言語">
            <label><input type="radio" name="lang" value="japanese" checked><span>日本語</span></label>
            <label><input type="radio" name="lang" value="english"><span>English</span></label>
            <label><input type="radio" name="lang" value=""><span>自動</span></label>
          </div>
        </div>
      </div>

      <button class="key main" id="start" disabled>
        <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>
        <span>文字起こし</span>
      </button>
    </div>

    <div class="line">
      <div id="status" role="status" aria-live="polite"></div>
      <progress id="bar" max="100" value="0" hidden></progress>
    </div>
  </section>

  <div class="tools">
    <button class="key" id="copy" disabled>
      <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="1.5"/><path d="M16 8V6.5A1.5 1.5 0 0 0 14.5 5h-8A1.5 1.5 0 0 0 5 6.5v8A1.5 1.5 0 0 0 6.5 16H8"/></svg></span>
      <span>コピー</span>
    </button>
    <button class="key" id="dltxt" disabled>
      <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg></span>
      <span>テキスト</span>
    </button>
    <button class="key" id="dlsrt" disabled>
      <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg></span>
      <span>字幕 .srt</span>
    </button>
  </div>
  <ol id="list" aria-label="文字起こし結果"></ol>

  <p class="note">初回はモデルのダウンロードが必要です（tiny 約40MB／base 約80MB／small 約250MB。2回目以降はキャッシュされます）。WebGPU対応のChromeだと速く動きます。行をクリックすると、その位置から再生します。</p>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);
const val = (name) => document.querySelector('input[name="' + name + '"]:checked').value;
const fileEl = $("file"), startEl = $("start"), statusEl = $("status"), barEl = $("bar");
const videoEl = $("video"), listEl = $("list");
const SR = 16000, WIN = 30 * SR;

let currentFile = null, segs = [], asr = null, asrKey = "", busy = false, objUrl = null;

function setStatus(msg, isErr = false){ statusEl.textContent = msg; statusEl.classList.toggle("err", isErr); }
function setBar(v){ if (v == null){ barEl.hidden = true; return; } barEl.hidden = false; barEl.value = v; }
const pad = (n, w = 2) => String(Math.floor(n)).padStart(w, "0");
function mmss(t){ return pad(t / 60) + ":" + pad(t % 60); }
function srtTime(t){
  const ms = Math.round((t % 1) * 1000);
  return pad(t / 3600) + ":" + pad((t % 3600) / 60) + ":" + pad(t % 60) + "," + pad(ms, 3);
}

fileEl.addEventListener("change", () => {
  const f = fileEl.files[0];
  if (!f) return;
  currentFile = f;
  $("fname").textContent = f.name;
  if (objUrl) URL.revokeObjectURL(objUrl);
  objUrl = URL.createObjectURL(f);
  videoEl.src = objUrl;
  $("screen").classList.add("loaded");
  segs = []; render();
  setStatus("");
  startEl.disabled = false;
});

async function decodeAudio(file){
  const buf = await file.arrayBuffer();
  const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SR });
  let ab;
  try { ab = await ctx.decodeAudioData(buf); } finally { ctx.close(); }
  const out = new Float32Array(ab.length);
  const ch = ab.numberOfChannels;
  for (let c = 0; c < ch; c++){
    const d = ab.getChannelData(c);
    for (let i = 0; i < d.length; i++) out[i] += d[i] / ch;
  }
  return out;
}

async function loadModel(modelId){
  const device = navigator.gpu ? "webgpu" : "wasm";
  const key = modelId + "|" + device;
  if (asr && asrKey === key) return asr;
  setStatus("モデルを準備中…（初回はダウンロードします）");
  setBar(0);
  const { pipeline } = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1");
  const files = {};
  const opts = {
    device,
    progress_callback: (p) => {
      if (p.status === "progress" && p.file){
        files[p.file] = p.progress || 0;
        const vals = Object.values(files);
        const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
        setBar(avg);
        setStatus("モデルをダウンロード中… " + Math.round(avg) + "%");
      }
    },
  };
  opts.dtype = device === "webgpu"
    ? { encoder_model: "fp32", decoder_model_merged: "q4" }
    : "q8";
  asr = await pipeline("automatic-speech-recognition", modelId, opts);
  asrKey = key;
  return asr;
}

startEl.addEventListener("click", async () => {
  if (!currentFile || busy) return;
  busy = true; startEl.disabled = true;
  segs = []; render();
  try {
    const model = await loadModel(val("model"));
    setBar(null);
    setStatus("音声を取り出し中…");
    const audio = await decodeAudio(currentFile);
    const lang = val("lang");
    const total = audio.length;
    for (let s = 0; s < total; s += WIN){
      const chunk = audio.subarray(s, Math.min(s + WIN, total));
      const off = s / SR;
      setBar((s / total) * 100);
      setStatus("文字起こし中… " + mmss(off) + " / " + mmss(total / SR));
      const o = { task: "transcribe", return_timestamps: true };
      if (lang) o.language = lang;
      const r = await model(chunk, o);
      for (const c of (r.chunks || [])){
        const text = (c.text || "").trim();
        if (!text) continue;
        const st = (c.timestamp[0] ?? 0) + off;
        const en = (c.timestamp[1] ?? chunk.length / SR) + off;
        segs.push({ start: st, end: en, text });
      }
      render();
    }
    setBar(null);
    setStatus(segs.length ? "完了しました（" + segs.length + "行）" : "音声から文字を検出できませんでした。");
  } catch (e){
    console.error(e);
    setBar(null);
    setStatus("エラー：" + (e && e.message ? e.message : e) + "（動画に音声トラックがあるか、ブラウザが対応形式か確認してください）", true);
  } finally {
    busy = false; startEl.disabled = false;
  }
});

function render(){
  listEl.innerHTML = "";
  segs.forEach((s, i) => {
    const li = document.createElement("li");
    li.dataset.i = i;
    const t = document.createElement("time"); t.textContent = mmss(s.start);
    const p = document.createElement("span"); p.textContent = s.text;
    li.append(t, p);
    li.addEventListener("click", () => { videoEl.currentTime = s.start; videoEl.play(); });
    listEl.append(li);
  });
  const has = segs.length > 0;
  ["copy", "dltxt", "dlsrt"].forEach((id) => { $(id).disabled = !has; });
}

let activeIdx = -1;
videoEl.addEventListener("timeupdate", () => {
  const t = videoEl.currentTime;
  const idx = segs.findIndex((s) => t >= s.start && t < s.end);
  if (idx === activeIdx) return;
  if (activeIdx >= 0 && listEl.children[activeIdx]) listEl.children[activeIdx].classList.remove("active");
  activeIdx = idx;
  if (idx >= 0){
    const li = listEl.children[idx];
    li.classList.add("active");
    const top = li.offsetTop - listEl.offsetTop;
    if (top < listEl.scrollTop || top + li.offsetHeight > listEl.scrollTop + listEl.clientHeight){
      listEl.scrollTo({ top: top - listEl.clientHeight / 3, behavior: "smooth" });
    }
  }
});
videoEl.addEventListener("seeked", () => { activeIdx = -2; videoEl.dispatchEvent(new Event("timeupdate")); });

const plain = () => segs.map((s) => s.text).join("\n");
function download(name, text){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const base = () => (currentFile ? currentFile.name.replace(/\.[^.]+$/, "") : "transcript");

$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(plain()); setStatus("コピーしました"); }
  catch { setStatus("コピーできませんでした。テキスト保存を使ってください。", true); }
});
$("dltxt").addEventListener("click", () => download(base() + ".txt", plain()));
$("dlsrt").addEventListener("click", () => {
  const srt = segs.map((s, i) => (i + 1) + "\n" + srtTime(s.start) + " --> " + srtTime(s.end) + "\n" + s.text + "\n").join("\n");
  download(base() + ".srt", srt);
});
</script>
</body>
</html>
